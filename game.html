<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>푸에르토리코 1897 — 플레이</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app" class="wrap"></div>

<!-- 스크립트는 일반 <script> 태그로, 아래 순서대로 로드한다.
     ES 모듈(type="module")을 쓰지 않는 이유: file:// 로 더블클릭해 여는 실행 방식을 지켜야 하는데,
     모듈은 file:// 에서 CORS로 차단된다. 일반 스크립트의 최상위 선언은 전역으로 공유되므로
     파일을 나눠도 한 파일일 때와 동작이 같다.
     로드 순서 = 의존 방향: 데이터 → 상태 → 뷰 → 엔진 → AI → 저장 → 렌더 → UI → 부팅.
     error-guard.js 는 다른 스크립트의 사고를 잡아야 하므로 반드시 첫 번째. -->
<script src="js/error-guard.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/view.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/storage.js"></script>
<script src="js/render.js"></script>
<script src="js/panel.js"></script>
<script src="js/ui.js"></script>
<!-- 온라인 멀티플레이 (Supabase) — vendor 번들은 저장소에 포함(CDN 금지 원칙 유지).
     네트워크가 없거나 번들이 빠져도 netConfigured()가 false가 되어 로컬 플레이는 그대로 동작한다. -->
<script src="js/vendor/supabase.js"></script>
<script src="js/net-config.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
</body>
</html>
